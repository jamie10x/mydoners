# HTTP only — run `certbot --nginx -d mydoners.uz` after this is in place
# and DNS resolves; certbot adds the HTTPS block and redirect automatically.
# Telegram requires the Mini App to be served over HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mydoners.uz www.mydoners.uz;

    root /var/www/mydoners.uz;
    index index.html;

    access_log /var/log/nginx/mydoners.uz.access.log;
    error_log /var/log/nginx/mydoners.uz.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
