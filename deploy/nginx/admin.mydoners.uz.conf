# HTTP only — run `certbot --nginx -d admin.mydoners.uz` after this is in
# place; certbot adds the HTTPS block and redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name admin.mydoners.uz;

    root /var/www/admin.mydoners.uz;
    index index.html;

    access_log /var/log/nginx/admin.mydoners.uz.access.log;
    error_log /var/log/nginx/admin.mydoners.uz.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
