# HTTP only — run `certbot --nginx -d api.mydoners.uz` after this is in
# place and DNS resolves; certbot will add the HTTPS server block and
# redirect automatically (matching this host's existing sites, e.g.
# api.jamshiddev.uz).
server {
    listen 80;
    listen [::]:80;
    server_name api.mydoners.uz;

    access_log /var/log/nginx/api.mydoners.uz.access.log;
    error_log /var/log/nginx/api.mydoners.uz.error.log;

    client_max_body_size 10M;

    # Courier Bot webhook (BOT_MODE=webhook) — path rewritten to the
    # container's internal webhook path.
    location /courier-bot/webhook {
        proxy_pass http://127.0.0.1:4211/telegram-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer Bot webhook (@mydoner_bot, BOT_MODE=webhook) — /start, /help.
    location /customer-bot/webhook {
        proxy_pass http://127.0.0.1:4212/telegram-webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST + Socket.io (path /realtime) share this one location —
    # the Upgrade/Connection headers only matter for the WS handshake.
    location / {
        proxy_pass http://127.0.0.1:4210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
