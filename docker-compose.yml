services:
  postgres:
    image: postgres:16-alpine
    container_name: mydoners-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydoners
      POSTGRES_PASSWORD: mydoners_dev
      POSTGRES_DB: mydoners
    ports:
      - "5433:5432"
    volumes:
      - mydoners_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydoners -d mydoners"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mydoners-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - mydoners_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mydoners_postgres_data:
  mydoners_redis_data:
